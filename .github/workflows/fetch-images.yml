name: fetch-images
on:
  push:
    paths: ['tools/manifest.json','tools/fetch.py','.github/workflows/fetch-images.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow
      - run: python tools/fetch.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add p tools/failed.json
          git commit -m "Fetch images to repo" || echo "nothing to commit"
          git push
