<style>
:root{--bg:#fff;--ink:#000;--soft:#6b6b6b;--faint:#a3a3a3;--line:#e6e6e6;--band:#f3f3f3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}img{display:block;max-width:100%}
h1{font-weight:400;font-size:clamp(32px,4.4vw,56px);line-height:1.15;letter-spacing:-.02em;text-align:center;margin:clamp(64px,12vw,160px) auto 40px;padding:0 20px}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:0 20px;margin-bottom:28px}
.pill{display:inline-flex;align-items:center;gap:10px;font:500 18px Inter,sans-serif;padding:14px 26px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.pill:hover{border-color:var(--ink)}.pill[aria-pressed=true]{background:#000;color:#fff;border-color:#000}
.pill .n{color:var(--faint);font-weight:400}.dot{width:10px;height:10px;border-radius:50%}
.bands{display:grid;gap:14px;padding:0 14px}
.band{all:unset;cursor:zoom-in;display:block;background:var(--band);padding:clamp(40px,7vw,96px) 6%}
.band img{width:100%;height:auto;mix-blend-mode:multiply}
.band[hidden]{display:none}
.sec{max-width:1400px;margin:120px auto 0;padding:0 20px}
.sec h2{font-weight:400;font-size:28px;letter-spacing:-.01em;margin:0 0 32px;text-align:center}
.masonry{columns:4 260px;column-gap:14px}
.masonry button{all:unset;cursor:zoom-in;display:block;margin:0 0 14px;break-inside:avoid;background:var(--band)}
.masonry button[hidden]{display:none}
.masonry img{width:100%;height:auto}
.tl{list-style:none;margin:0 auto;padding:0;max-width:980px}
.tl li{display:grid;grid-template-columns:140px 120px 1fr;gap:20px;padding:18px 0;border-top:1px solid var(--line);align-items:baseline}
.tl li[hidden]{display:none}
.tl .y{font-size:22px;font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tl .b{font-size:13px;color:var(--soft);display:flex;gap:8px;align-items:center}
.tl .t{font-size:16px;line-height:1.5}.tl .t a{color:var(--faint);text-decoration:none;margin-left:4px}
footer{max-width:980px;margin:120px auto 0;padding:24px 20px 48px;border-top:1px solid var(--line);color:var(--soft);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lb{position:fixed;inset:0;z-index:50;background:#fff;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.lb[hidden]{display:none}
.lb .pic{background:var(--band);display:grid;place-items:center;overflow:auto;padding:24px}
.lb .pic img{max-height:calc(100vh - 48px);max-width:100%;width:auto;mix-blend-mode:multiply}
.lb .pic.wide img{max-height:none;width:100%}
.lb .txt{padding:32px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.lb .txt .k{font-size:13px;color:var(--soft);display:flex;gap:8px;align-items:center}
.lb .txt h3{margin:0;font-weight:500;font-size:22px;line-height:1.25;letter-spacing:-.01em}
.lb .txt p{margin:0;color:#333;line-height:1.55}.lb .txt .src{font-size:13px;color:var(--soft)}
.lb .ctl{display:flex;gap:8px;margin-top:auto}
.lb .ctl button{font:500 15px Inter,sans-serif;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 18px;cursor:pointer}
.lb .ctl button:hover{border-color:#000}
@media(max-width:820px){.lb{grid-template-columns:1fr;grid-template-rows:55vh auto}.tl li{grid-template-columns:90px 1fr}.tl .t{grid-column:1/-1}.pill{font-size:16px;padding:11px 20px}}
</style></head><body>

const yk=y=>{const m=y.match(/\d{4}/);if(m)return +m[0];const d=y.match(/(\d0)-е/);if(y.includes('10-е'))return 2016;if(y.includes('2000–10'))return 2008;return d?1900+(+d[1])+(y.includes('конец')?8:y.includes('начало')?1:5):y.includes('рубеж')?1999:2005};
const brandsOf=g=>Object.keys(BR).filter(k=>g.b===k||(g.c+' '+g.f).toLowerCase().includes(k));
const TL=[...R.map(([b,y,t,s,m])=>[b==='adidas'?'bind':b,y,t,S[s]]),...EXTRA].sort((a,b)=>yk(a[1])-yk(b[1]));
let F='all';
const cnt=k=>k==='all'?SKIS.length+SC.length:SKIS.filter(s=>s.b===k).length+SC.filter(g=>brandsOf(g).includes(k)).length;
pills.innerHTML=[['all','Все'],...Object.entries(BR)].map(([k,n])=>`<button class="pill" data-k="${k}" aria-pressed="${k==='all'}">${k!=='all'?dot(k):''}${n}<span class="n">${cnt(k)}</span></button>`).join('');
const ITEMS=[];
SKIS.forEach(s=>{const b=document.createElement('button');b.className='band';b.dataset.br=s.b;b.innerHTML=`<img src="ski/${s.f}" alt="${s.t}">`;const i=ITEMS.push({src:'ski/'+s.f,wide:1,k:`${dot(s.b)}${BR[s.b]} · ${s.y}`,t:s.t,p:s.p,s:`<a href="${s.u}" target="_blank" rel="noopener">Источник: сайт производителя</a>`,el:b})-1;b.onclick=()=>open(i);bands.appendChild(b)});
SC.forEach(g=>{const b=document.createElement('button');b.dataset.br=brandsOf(g).join(' ');b.innerHTML=`<img src="thumb/${g.f}" width="${g.w}" height="${g.h}" loading="lazy" alt="">`;const [t,...r]=g.c.split(' — ');const i=ITEMS.push({src:'img/'+g.f,k:brandsOf(g).map(dot).join('')+' Сезон '+g.y,t:t,p:r.join(' — '),s:`<a href="${g.u}" target="_blank" rel="noopener">${g.s}</a>`,el:b})-1;b.onclick=()=>open(i);mas.appendChild(b)});
TL.forEach(([b,y,t,u])=>{const li=document.createElement('li');li.dataset.br=b;li.innerHTML=`<span class="y">${y}</span><span class="b">${dot(b)}${b==='bind'?'Крепления':BR[b]}</span><span class="t">${t}<a href="${u}" target="_blank" rel="noopener">↗</a></span>`;tl.appendChild(li)});
pills.onclick=e=>{const p=e.target.closest('.pill');if(!p)return;F=p.dataset.k;pills.querySelectorAll('.pill').forEach(x=>x.setAttribute('aria-pressed',x===p));document.querySelectorAll('[data-br]').forEach(el=>el.hidden=!(F==='all'||el.dataset.br.split(' ').includes(F)))};
let cur=0;const vis=()=>ITEMS.map((x,i)=>i).filter(i=>!ITEMS[i].el.hidden);
function open(i){cur=i;const x=ITEMS[i];lbimg.src=x.src;lbpic.classList.toggle('wide',!!x.wide);lbk.innerHTML=x.k;lbt.textContent=x.t;lbp.textContent=x.p||'';lbs.innerHTML=x.s;lb.hidden=false;document.body.style.overflow='hidden'}
function close(){lb.hidden=true;document.body.style.overflow=''}
function step(d){const v=vis(),p=v.indexOf(cur);open(v[(p+d+v.length)%v.length])}
lbx.onclick=close;lbnext.onclick=()=>step(1);lbprev.onclick=()=>step(-1);
document.onkeydown=e=>{if(lb.hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)};
</script></body></html>
