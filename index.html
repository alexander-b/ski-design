<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Беговые лыжи — архив дизайна</title>
<meta name="description" content="Архив дизайна беговых лыж Fischer, Atomic, Madshus и Rossignol с 1970-х до 2027 года.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#000;--mut:#7a7a7a;--line:#e6e6e6;--card:#f2f2f2;--pill:#f2f2f2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
a{color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;font-size:14px}
.top b{font-weight:600}
.top span{color:var(--mut)}

/* ---------- timeline ---------- */
.tl{padding:28px 0 8px;user-select:none;-webkit-user-select:none}
.yr{font-weight:500;font-size:clamp(64px,11vw,168px);line-height:.9;letter-spacing:-.055em;text-align:center;margin:0;font-variant-numeric:tabular-nums}
.ev{max-width:760px;margin:22px auto 0;padding:0 24px;text-align:center;font-size:17px;line-height:1.45;height:calc(4 * 1.45em);overflow:hidden}
.ev .clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
.ev p{display:inline;margin:0}
.ev p+p:before{content:"  ·  ";color:var(--mut)}
.ev .tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);margin-right:6px;white-space:nowrap}
.ev .tag i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ev .yy{color:var(--mut);font-variant-numeric:tabular-nums}
.ev .src{font-size:13px;color:var(--mut);text-decoration:none;border-bottom:1px solid var(--line)}
.ruler{position:relative;height:96px;margin-top:22px;overflow:hidden;cursor:grab;touch-action:pan-y}
.ruler.drag{cursor:grabbing}
.track{position:absolute;left:0;top:0;height:100%;will-change:transform}
.tick{position:absolute;bottom:26px;width:1px;background:#cfcfcf;height:12px}
.tick.dec{height:26px;background:#000}
.tick.mid{height:18px;background:#aaa}
.lab{position:absolute;bottom:0;transform:translateX(-50%);font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.bar{position:absolute;bottom:42px;width:5px;margin-left:-2px;background:#e3e3e3;border-radius:2px}
.dot{position:absolute;bottom:30px;width:6px;height:6px;margin-left:-3px;border-radius:50%}
.needle{position:absolute;left:50%;top:6px;bottom:22px;width:2px;margin-left:-1px;background:#000;border-radius:1px;pointer-events:none}
.needle:before{content:"";position:absolute;top:-6px;left:-4px;width:10px;height:10px;border-radius:50%;background:#000}
.fade{position:absolute;top:0;bottom:0;width:15%;pointer-events:none;z-index:2}
.fade.l{left:0;background:linear-gradient(90deg,#fff,rgba(255,255,255,0))}
.fade.r{right:0;background:linear-gradient(270deg,#fff,rgba(255,255,255,0))}
.hint{text-align:center;font-size:12px;color:var(--mut);margin-top:8px}
.rrow{position:relative;margin-top:22px}
.rrow .ruler{margin-top:0}
.rrow .pill{position:absolute;left:24px;top:50%;transform:translateY(-70%);z-index:3;box-shadow:0 0 0 12px #fff}
.ruler.dim .needle{opacity:0}
.ruler.dim .track{opacity:.55}
@media (max-width:760px){.rrow .pill{left:16px}}
.pill.sm{font-size:14px;padding:10px 18px}
.bh{padding:28px 0 0}
.bh .ev{height:auto;font-size:15px;color:var(--mut)}

.tl[hidden],.bh[hidden],.pills[hidden]{display:none}
.yr.br{text-transform:none}
.grid{min-height:60vh}

/* ---------- pills ---------- */
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:34px 24px 30px}
.pill{appearance:none;border:0;background:var(--pill);color:#000;font:500 17px/1 Inter,sans-serif;padding:15px 24px;border-radius:999px;display:inline-flex;align-items:center;gap:10px;cursor:pointer;transition:background .15s,color .15s}
.pill i{width:10px;height:10px;border-radius:50%;display:inline-block}
.pill small{font-size:13px;color:var(--mut);font-weight:500}
.pill:hover{background:#e7e7e7}
.pill.on{background:#000;color:#fff}
.pill.on small{color:#9a9a9a}

/* ---------- masonry ---------- */
.grid{display:flex;gap:16px;padding:0 24px 80px;align-items:flex-start}
.col{flex:1;display:flex;flex-direction:column;gap:16px;min-width:0}
.card{position:relative;border-radius:24px;background:var(--card);overflow:hidden;cursor:zoom-in;display:block;width:100%;border:0;padding:0;transition:opacity .25s}
.card img{display:block;width:100%;height:100%}
.card.ski{aspect-ratio:3/4}
.card.ski img{object-fit:contain;mix-blend-mode:multiply;padding:7% 0}
.card.ski.thin img{padding:5% 0}
.card.ski.wide{aspect-ratio:16/7!important}
.card.ski.wide img{object-fit:cover;object-position:center}
.card.ski.xw{aspect-ratio:3/1!important}
.card.ski.xw img{object-fit:contain;transform:none;padding:0 5%}
.card.photo img,.card.scan img{object-fit:cover}
.card.gear img{object-fit:contain;mix-blend-mode:multiply;padding:9%}
.pills{flex-direction:column;align-items:center;gap:12px}
.prow{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.prow.sm{gap:8px}
.card .yb{position:absolute;left:12px;top:12px;font-size:12px;font-weight:500;background:rgba(255,255,255,.85);padding:5px 9px;border-radius:999px;opacity:0;transition:opacity .15s;display:flex;align-items:center;gap:6px}
.card .yb i{width:7px;height:7px;border-radius:50%}
.card:hover .yb,.card:focus-visible .yb{opacity:1}
.card.far{opacity:.45}
.card:focus-visible{outline:2px solid #000;outline-offset:2px}
.empty{flex:1;text-align:center;color:var(--mut);padding:40px;display:flex;align-items:center;justify-content:center;gap:12px}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;background:#fff;z-index:50;display:none;grid-template-columns:1fr 400px}
.lb.open{display:grid}
.lb .stage{position:relative;display:flex;align-items:center;justify-content:center;background:#f4f4f4;overflow:hidden;min-height:0}
.lb .stage img{max-width:calc(100% - 48px);max-height:calc(100vh - 48px);object-fit:contain;mix-blend-mode:multiply}
.lb .stage.rot img{max-width:none;max-height:none}
.lb aside{padding:32px 32px 28px;display:flex;flex-direction:column;gap:14px;overflow:auto;border-left:1px solid var(--line)}
.lb .b{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.lb .b i{width:9px;height:9px;border-radius:50%}
.lb h2{font-weight:500;font-size:30px;line-height:1.1;letter-spacing:-.03em;margin:0}
.lb .y{font-size:15px;color:var(--mut);font-variant-numeric:tabular-nums}
.lb p{margin:0;font-size:16px;line-height:1.5}
.lb .s{font-size:13px;color:var(--mut);margin-top:auto}
.lb .s a{color:#000}
.lb .nav{display:flex;gap:8px}
.lb button.c{appearance:none;border:0;background:var(--pill);border-radius:999px;font:500 14px Inter,sans-serif;padding:10px 16px;cursor:pointer}
.lb button.c:hover{background:#e7e7e7}
.lb .x{position:absolute;right:16px;top:16px;z-index:3}
.lb .rotb{position:absolute;left:16px;bottom:16px;z-index:3}

/* ---------- list ---------- */
.list{max-width:980px;margin:0 auto;padding:40px 24px 120px;border-top:1px solid var(--line)}
.list h3{font-weight:500;font-size:28px;letter-spacing:-.03em;margin:0 0 24px}
.list ol{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:110px 130px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.list li:hover{background:#fafafa}
.list li .ly{font-variant-numeric:tabular-nums;color:var(--mut)}
.list li .lbn{display:flex;align-items:center;gap:7px}
.list li .lbn i{width:8px;height:8px;border-radius:50%}
.foot{max-width:980px;margin:0 auto;padding:0 24px 60px;color:var(--mut);font-size:13px}

@media (max-width:1100px){.lb{grid-template-columns:1fr 340px}}
@media (max-width:760px){
 .top{padding:14px 16px}
 .grid{padding:0 16px 60px;gap:10px}.col{gap:10px}
 .card{border-radius:18px}
 .pill{font-size:15px;padding:12px 18px}
 .ev{font-size:15px}
 .pills{padding:26px 16px 22px;gap:8px}
 .lb{grid-template-columns:1fr;grid-template-rows:62vh auto}
 .lb .stage img{max-height:calc(62vh - 32px)}
 .lb aside{border-left:0;border-top:1px solid var(--line);padding:22px 18px}
 .list li{grid-template-columns:70px 1fr;}
 .list li .lt{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="top"><b>Беговые лыжи · архив дизайна</b><span id="count"></span></div>

<section class="tl" id="tl" aria-label="Хронология">
  <h1 class="yr" id="yr">1980-е</h1>
  <div class="ev" id="ev" aria-live="polite"></div>
  <div class="rrow">
  <button class="pill sm" id="allbtn">Всё время</button>
  <div class="ruler" id="ruler" tabindex="0" aria-label="Перетащите шкалу, чтобы выбрать год">
    <div class="track" id="track"></div>
    <div class="needle"></div>
    <div class="fade l"></div><div class="fade r"></div>
  </div>
  </div>
  <div class="hint">Тяни шкалу — ниже лыжи и материалы этого времени</div>
</section>

<nav class="pills" id="pills"></nav>
<main class="grid" id="grid"></main>

<section class="list">
  <h3>Хронология</h3>
  <ol id="list"></ol>
</section>
<div class="foot">Фото продуктов загружаются с официальных сайтов брендов, Wikimedia Commons и веб-архива; сканы из Google Books и каталогов USU. Все права на изображения у их владельцев.</div>

<div class="lb" id="lb" role="dialog" aria-modal="true">
  <div class="stage" id="stage"><img id="lbimg" alt=""><button class="c x" id="lbx">Закрыть</button><button class="c rotb" id="lbrot" hidden>Повернуть</button></div>
  <aside>
    <div class="b" id="lbb"></div>
    <h2 id="lbt"></h2>
    <div class="y" id="lby"></div>
    <p id="lbd"></p>
    <div class="s" id="lbs"></div>
    <div class="nav"><button class="c" id="lbp">← Назад</button><button class="c" id="lbn">Дальше →</button></div>
  </aside>
</div>

function drawPills(){

// ---------- masonry ----------
const grid=document.getElementById('grid');
const cards=new Map();
function card(x){
  if(cards.has(x.i))return cards.get(x.i);
  const el=document.createElement('button');
  const thin=x.k==='ski'&&x.w&&x.h/x.w>6;
  const wide=x.k==='ski'&&x.w>x.h;
  el.className='card '+x.k+(thin?' thin':'')+(wide?(x.w/x.h>5?' wide xw':' wide'):'');
  if(x.k==='gear'){const a=Math.min(1.4,Math.max(.6,x.h/x.w||1));el.style.aspectRatio='1/'+a}
  else if((x.k!=='ski'||wide)&&x.w&&x.h)el.style.aspectRatio=x.w+'/'+x.h;
  const im=document.createElement('img');im.loading='lazy';im.decoding='async';im.alt=x.t;im.src=x.src;
  im.onerror=()=>{el.remove();x.dead=1};
  const yb=document.createElement('span');yb.className='yb';const d=document.createElement('i');d.style.background=COL[x.b]||'#999';yb.append(d,String(x.y));
  el.append(im,yb);el.onclick=()=>openLb(x.i);cards.set(x.i,el);return el;
}
function ncols(){const w=innerWidth;return w>1500?5:w>1100?4:w>760?3:2}
let lastKey='';
function layout(force){
  const base=all.filter(x=>!x.dead&&okB(x)&&okC(x));
  if(allTime){items=base.sort((a,b)=>b.yn-a.yn||a.i-b.i)}
  else{
    const near=base.sort((a,b)=>Math.abs(a.yn-Y)-Math.abs(b.yn-Y)||a.yn-b.yn||a.i-b.i);
    items=near.filter(x=>Math.abs(x.yn-Y)<=2);
  }
  history.replaceState(null,'',allTime?'#all':'#'+Math.round(Y));
  const key=allTime+brand+'|'+ncols()+'|'+items.map(x=>x.i).join(',');
  document.getElementById('count').textContent=items.length+' изображений';
  
  if(key===lastKey&&!force)return;lastKey=key;
  const n=ncols(),cols=[],hs=[];grid.textContent='';
  for(let i=0;i<n;i++){const c=document.createElement('div');c.className='col';grid.append(c);cols.push(c);hs.push(0)}
  for(const x of items){
    const r=x.k==='ski'?(x.w>x.h?(x.w/x.h>5?1/3:7/16):4/3):x.k==='gear'?Math.min(1.4,Math.max(.6,x.h/x.w||1)):(x.w&&x.h?x.h/x.w:1);
    let k=0;for(let i=1;i<n;i++)if(hs[i]<hs[k]-.05)k=i;
    cols[k].append(card(x));hs[k]+=r+.08;
  }
  if(!items.length){
    const e=document.createElement('div');e.className='empty';grid.textContent='';grid.append(e);
    const pool=all.filter(x=>!x.dead&&okB(x)&&okC(x));
    if(!pool.length){e.textContent='Пусто';return}
    const ne=pool.reduce((a,x)=>Math.abs(x.yn-Y)<Math.abs(a.yn-Y)?x:a);const ny=Math.round(ne.yn);
    e.append('Материалов за эти годы пока нет. Ближайшие — ');
    const b=document.createElement('button');b.className='pill sm';b.textContent=ny;b.onclick=()=>{setY(ny);layout()};e.append(b);
  }
}

const ruler=document.getElementById('ruler'),track=document.getElementById('track');
let PX=22,off=0;
function buildRuler(){
  PX=innerWidth<760?16:22;track.textContent='';
  const cnt={};all.forEach(x=>{const y=Math.round(x.yn);cnt[y]=(cnt[y]||0)+1});const mx=Math.max(...Object.values(cnt));
  for(let y=Y0;y<=Y1;y++){
    const t=document.createElement('div');t.className='tick'+(y%10===0?' dec':y%5===0?' mid':'');t.style.left=(y-Y0)*PX+'px';track.append(t);
    if(y%10===0||(y===Y1)){const l=document.createElement('div');l.className='lab';l.style.left=(y-Y0)*PX+'px';l.textContent=y;track.append(l)}
    if(cnt[y]){const b=document.createElement('div');b.className='bar';b.style.left=(y-Y0)*PX+'px';b.style.height=(4+28*Math.sqrt(cnt[y]/mx))+'px';track.append(b)}
  }
  const seen={};for(const e of EVENTS){const y=Math.round(e.yn);const k=y+e.b;if(seen[k])continue;seen[k]=1;const d=document.createElement('div');d.className='dot';d.style.background=COL[e.b]||'#999';d.style.left=(e.yn-Y0)*PX+'px';d.style.bottom=(30-8*(Object.keys(seen).filter(z=>z.startsWith(y)).length-1))+'px';track.append(d)}
  track.style.width=(Y1-Y0+1)*PX+'px';
}
function setY(y,instant){
  y=Math.max(Y0,Math.min(Y1,y));Y=y;
  off=ruler.clientWidth/2-(y-Y0)*PX;

}

  document.getElementById('yr').textContent=y<1980&&false?'':y;
  const ev0=document.getElementById('ev');ev0.textContent='';const ev=document.createElement('div');ev.className='clamp';ev0.append(ev);
  let near=EVENTS.filter(e=>Math.round(e.yn)===y||Math.floor(e.yn)===y);
  let label=null;
  if(!near.length){
    const dec=Math.floor(y/10)*10;
    const c=all.filter(x=>Math.round(x.yn)===y&&okB(x)&&okC(x)).length;
    const p=document.createElement('p');p.className='yy';
    p.textContent=c?(c+' '+plural(c,['изображение','изображения','изображений'])+' этого года ниже'):'Событий за этот год нет — ближайшее: ';
    if(!c){const ne=EVENTS.reduce((a,e)=>Math.abs(e.yn-y)<Math.abs(a.yn-y)?e:a);const a=document.createElement('a');a.href='#';a.className='src';a.textContent=ne.y;a.onclick=ev2=>{ev2.preventDefault();setY(Math.round(ne.yn));layoutSoon()};p.append(a)}
    ev.append(p);return;
  }
  for(const e of near.slice(0,3)){
    const p=document.createElement('p');
    const tag=document.createElement('span');tag.className='tag';const i=document.createElement('i');i.style.background=COL[e.b]||'#999';tag.append(i,NAME[e.b]||e.b);
    p.append(tag,e.t+' ');
    if(e.u){const a=document.createElement('a');a.className='src';a.href=e.u;a.target='_blank';a.rel='noopener';a.textContent='источник';p.append(a)}
    ev.append(p);
  }
}
function plural(n,f){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return f[2];if(n1>1&&n1<5)return f[1];if(n1===1)return f[0];return f[2]}
let lt;function layoutSoon(){clearTimeout(lt);lt=setTimeout(()=>layout(),90)}
let drag=null;
ruler.addEventListener('pointerdown',e=>{if(allTime)setAll(false);drag={x:e.clientX,off,moved:0};ruler.classList.add('drag');ruler.setPointerCapture(e.pointerId);track.style.transition='none'});
ruler.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;drag.moved=Math.max(drag.moved,Math.abs(dx));let o=drag.off+dx;const y=Y0+(ruler.clientWidth/2-o)/PX;const yc=Math.max(Y0,Math.min(Y1,y));off=ruler.clientWidth/2-(yc-Y0)*PX;track.style.transform='translateX('+off+'px)';if(Math.round(yc)!==Math.round(Y)){Y=yc;drawText();layoutSoon()}else Y=yc});
const endDrag=e=>{if(!drag)return;ruler.classList.remove('drag');if(drag.moved<4){const r=ruler.getBoundingClientRect();const y=Y0+(e.clientX-r.left-off)/PX;setY(Math.round(y))}else setY(Math.round(Y));drag=null;layout()};
ruler.addEventListener('pointerup',endDrag);ruler.addEventListener('pointercancel',endDrag);
ruler.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY)||e.shiftKey){e.preventDefault();if(allTime)setAll(false);const d=(e.deltaX||e.deltaY)/PX;setY(Y+d,true);clearTimeout(lt);lt=setTimeout(()=>{setY(Math.round(Y));layout()},160)}},{passive:false});
ruler.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();if(allTime)setAll(false);setY(Math.round(Y)+(e.key==='ArrowLeft'?-1:1));layoutSoon()}});

// ---------- list ----------
const list=document.getElementById('list');
for(const e of EVENTS){const li=document.createElement('li');const a=document.createElement('span');a.className='ly';a.textContent=e.y;const b=document.createElement('span');b.className='lbn';const i=document.createElement('i');i.style.background=COL[e.b]||'#999';b.append(i,NAME[e.b]||e.b);const t=document.createElement('span');t.className='lt';t.textContent=e.t;li.append(a,b,t);li.onclick=()=>{setAll(false);setY(Math.round(e.yn));layout();scrollTo({top:0,behavior:'smooth'})};list.append(li)}

// ---------- lightbox ----------
const lb=document.getElementById('lb'),lbimg=document.getElementById('lbimg'),stage=document.getElementById('stage'),rotb=document.getElementById('lbrot');
let cur=-1,rot=false;
function fitRot(){
  if(!rot){lbimg.style.cssText='';return}
  const W=stage.clientWidth-48,H=stage.clientHeight-48,w=lbimg.naturalWidth,h=lbimg.naturalHeight;
  const s=Math.min(W/h,H/w);lbimg.style.cssText='width:'+w*s+'px;height:'+h*s+'px;transform:rotate(90deg)';
}
function openLb(i){
  const pos=items.findIndex(x=>x.i===i);cur=pos;const x=items[pos];
  lbimg.removeAttribute('style');lbimg.src=x.src;
  const big=new Image();big.onload=()=>{if(items[cur]===x){lbimg.src=x.full;}};big.src=x.full;
  const thin=x.k==='ski'&&((x.w&&x.h/x.w>2.2)||(!x.w));
  rot=thin&&innerWidth>760;rotb.hidden=!(x.k==='ski');stage.classList.toggle('rot',rot);
  lbimg.onload=fitRot;
  const b=document.getElementById('lbb');b.textContent='';const d=document.createElement('i');d.style.background=COL[x.b]||'#999';b.append(d,NAME[x.b]||x.b);
  document.getElementById('lbt').textContent=x.t;
  document.getElementById('lby').textContent=x.y;
  document.getElementById('lbd').textContent=x.d||'';
  const s=document.getElementById('lbs');s.textContent='Источник: ';const a=document.createElement('a');a.href=x.u;a.target='_blank';a.rel='noopener';a.textContent=x.s;s.append(a);
  lb.classList.add('open');document.body.style.overflow='hidden';
}
function closeLb(){lb.classList.remove('open');document.body.style.overflow=''}
function step(d){if(!items.length)return;openLb(items[(cur+d+items.length)%items.length].i)}
document.getElementById('lbx').onclick=closeLb;
document.getElementById('lbp').onclick=()=>step(-1);
document.getElementById('lbn').onclick=()=>step(1);
rotb.onclick=()=>{rot=!rot;stage.classList.toggle('rot',rot);fitRot()};
addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
addEventListener('resize',()=>{if(lb.classList.contains('open'))fitRot()});

// ---------- init ----------
buildRuler();drawPills();
document.getElementById('allbtn').onclick=()=>{setAll(!allTime);layout()};
const h=location.hash.slice(1);
if(h==='all')allTime=true;else if(+h>=Y0&&+h<=Y1)Y=+h;
setY(Y,true);setAll(allTime);layout();
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h==='all'){setAll(true);layout()}else if(+h>=Y0&&+h<=Y1&&+h!==Math.round(Y)){setAll(false);setY(+h);layout()}});
</script>
</body>
